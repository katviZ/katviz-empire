<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Katviz avatar">
  <title>Katviz — social avatar (on void)</title>
  <defs>
    <linearGradient id="av-wand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="av-ear" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/><stop offset="50%" stop-color="#00E5FF"/><stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="av-trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/><stop offset="40%" stop-color="#FF6B9D"/><stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <radialGradient id="av-starglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/><stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="av-amb" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1A1A35"/><stop offset="100%" stop-color="#0A0A14"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#av-amb)"/>

  <!-- faint constellation -->
  <circle cx="380" cy="80" r="2" fill="#00E5FF" opacity="0.3"/>
  <circle cx="430" cy="120" r="1.5" fill="#00E5FF" opacity="0.2"/>
  <circle cx="96" cy="150" r="1.5" fill="#7C3AED" opacity="0.25"/>
  <circle cx="110" cy="400" r="2" fill="#FF6B9D" opacity="0.18"/>
  <circle cx="420" cy="410" r="1.5" fill="#00E5FF" opacity="0.15"/>

  <!-- crystal -->
  <path d="M158 100L170 80L182 100L170 130L158 100Z" fill="url(#av-wand)"/>
  <path d="M163 97L170 85L177 97L170 122L163 97Z" fill="#00E5FF" opacity="0.35"/>
  <circle cx="170" cy="100" r="3" fill="#00E5FF" opacity="0.6"/>
  <!-- wand -->
  <rect x="158" y="130" width="24" height="290" rx="6" fill="url(#av-wand)"/>
  <!-- ear -->
  <path d="M175 195 C210 130 270 85 335 95 C310 110 275 140 255 175 C240 200 195 210 175 195Z" fill="url(#av-ear)"/>
  <!-- trail -->
  <path d="M175 305 C240 305 300 340 365 395 C335 370 280 335 190 320Z" fill="url(#av-trail)"/>
  <!-- star -->
  <circle cx="365" cy="395" r="22" fill="url(#av-starglow)"/>
  <path d="M365 373L371 390L388 396L371 402L365 419L359 402L342 396L359 390Z" fill="#FFD700"/>
  <path d="M365 382L368 392L378 396L368 400L365 410L362 400L352 396L362 392Z" fill="#FFFFFF" opacity="0.55"/>
</svg>
