<svg width="240" height="240" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Katviz mark">
  <title>Katviz — prism mark (Prism Noir, transparent)</title>
  <defs>
    <linearGradient id="pm-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BE4FF"/>
      <stop offset="55%" stop-color="#9D7BFF"/>
      <stop offset="100%" stop-color="#FF6BC1"/>
    </linearGradient>
    <linearGradient id="pm-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1C26"/>
      <stop offset="100%" stop-color="#0E0E13"/>
    </linearGradient>
    <linearGradient id="pm-fan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BE4FF"/>
      <stop offset="50%" stop-color="#9D7BFF"/>
      <stop offset="100%" stop-color="#FF6BC1"/>
    </linearGradient>
    <linearGradient id="pm-ray-c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6BE4FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6BE4FF" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="pm-ray-v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9D7BFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9D7BFF" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="pm-ray-m" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6BC1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF6BC1" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="pm-inner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EDEDF2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9D7BFF" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="pm-entry" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#EDEDF2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EDEDF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- far-field star dust -->
  <circle cx="30" cy="38" r="1.6" fill="#6BE4FF" opacity="0.55"/>
  <circle cx="168" cy="26" r="1.3" fill="#9D7BFF" opacity="0.5"/>
  <circle cx="58" cy="178" r="1.4" fill="#FF6BC1" opacity="0.45"/>
  <circle cx="186" cy="178" r="1.1" fill="#EDEDF2" opacity="0.4"/>

  <!-- faint full-spectrum fan (behind the rays) -->
  <path d="M127 98 L198 44 L198 152 Z" fill="url(#pm-fan)" opacity="0.16"/>

  <!-- three spectral rays leaving the right face -->
  <path d="M127 93 L198 40 L198 52 Z" fill="url(#pm-ray-c)"/>
  <path d="M127 98 L198 90 L198 102 Z" fill="url(#pm-ray-v)"/>
  <path d="M127 103 L198 140 L198 152 Z" fill="url(#pm-ray-m)"/>

  <!-- incoming white beam -->
  <line x1="8" y1="98" x2="71" y2="98" stroke="#EDEDF2" stroke-width="7" stroke-linecap="round" opacity="0.16"/>
  <line x1="8" y1="98" x2="71" y2="98" stroke="#EDEDF2" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the prism -->
  <path d="M100 42 L154 154 L46 154 Z" fill="url(#pm-body)"/>
  <path d="M100 42 L100 154" stroke="#EDEDF2" stroke-width="1" opacity="0.07"/>
  <path d="M73 98 L127 98" stroke="url(#pm-inner)" stroke-width="1.5" opacity="0.6"/>
  <path d="M100 42 L154 154 L46 154 Z" stroke="url(#pm-edge)" stroke-width="2" stroke-linejoin="round"/>

  <!-- entry flare -->
  <circle cx="73" cy="98" r="9" fill="url(#pm-entry)"/>
  <circle cx="73" cy="98" r="2.4" fill="#FFFFFF"/>
</svg>
