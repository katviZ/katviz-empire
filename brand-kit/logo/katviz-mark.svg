<svg width="240" height="240" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Katviz mark">
  <title>Katviz — electrum star sigil (transparent)</title>
  <defs>
    <linearGradient id="km-electrum" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE7A8"/>
      <stop offset="42%" stop-color="#E8B339"/>
      <stop offset="100%" stop-color="#B5572A"/>
    </linearGradient>
    <radialGradient id="km-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="45%" stop-color="#FFE7A8"/>
      <stop offset="100%" stop-color="#E8B339" stop-opacity="0"/>
    </radialGradient>
    <filter id="km-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- alchemical vessel / orbit rings -->
  <circle cx="100" cy="100" r="82" stroke="#E8B339" stroke-width="1" opacity="0.22"/>
  <circle cx="100" cy="100" r="72" stroke="#E8B339" stroke-width="3" opacity="0.16"
          stroke-dasharray="1.5 13" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="58" stroke="#E8B339" stroke-width="0.75" opacity="0.10"/>

  <!-- constellation nodes -->
  <circle cx="100" cy="18" r="2" fill="#FFE7A8" opacity="0.85"/>
  <circle cx="171" cy="142" r="1.6" fill="#E8B339" opacity="0.5"/>
  <circle cx="33" cy="150" r="1.6" fill="#FF9E2C" opacity="0.45"/>
  <circle cx="158" cy="52" r="1.3" fill="#FFE7A8" opacity="0.55"/>

  <!-- the electrum star -->
  <path d="M100 24 C104 78 122 96 176 100 C122 104 104 122 100 176 C96 122 78 104 24 100 C78 96 96 78 100 24 Z"
        fill="url(#km-electrum)"/>
  <!-- inner gleam -->
  <path d="M100 50 C102 86 114 98 150 100 C114 102 102 114 100 150 C98 114 86 102 50 100 C86 98 98 86 100 50 Z"
        fill="#FFF6DD" opacity="0.18"/>

  <!-- molten core -->
  <circle cx="100" cy="100" r="16" fill="url(#km-core)" filter="url(#km-soft)"/>
  <circle cx="100" cy="100" r="4" fill="#FFFBF0"/>
</svg>
