<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Katviz favicon">
  <title>Katviz — favicon (simplified, reads at 16px)</title>
  <defs>
    <linearGradient id="fv-spectral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3BF0A6"/>
      <stop offset="100%" stop-color="#FF6BC1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A0A0E"/>
  <!-- bold prism, solid spectral fill -->
  <path d="M34 12 L56 54 L12 54 Z" fill="url(#fv-spectral)"/>
  <!-- white beam entering from the left -->
  <rect x="3" y="29" width="22" height="6" rx="3" fill="#EDEDF2"/>
</svg>
