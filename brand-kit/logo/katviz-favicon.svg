<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Katviz favicon">
  <title>Katviz — favicon (simplified, reads at 16px)</title>
  <defs>
    <linearGradient id="fv-wand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="fv-arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A0A14"/>
  <!-- wand (vertical of K) -->
  <rect x="20" y="14" width="7" height="36" rx="3.5" fill="url(#fv-wand)"/>
  <!-- upper arm: bold crescent -->
  <path d="M26 28 C33 18 42 14 50 16 C44 20 37 25 33 31 C31 34 27 33 26 28Z" fill="url(#fv-arm)"/>
  <!-- lower arm: trail to star -->
  <path d="M26 36 C34 36 42 41 49 49 C44 45 37 41 29 39Z" fill="#FF6B9D"/>
  <!-- star -->
  <path d="M49 42L51 47L56 49L51 51L49 56L47 51L42 49L47 47Z" fill="#FFD700"/>
</svg>
